    <rect x="10" y="14" width="110" height="222" rx="16" fill="#ffffff"/>
    <rect x="44" y="6" width="42" height="6" rx="3" fill="#334155"/>
    <rect x="22" y="34" width="86" height="40" rx="9" fill="url(#brand)"/>
    <path d="M30 44 L65 64 L100 44" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="22" y="88" width="86" height="34" rx="8" fill="#eef2ff"/>
    <rect x="30" y="97" width="60" height="8" rx="4" fill="#64748b"/>
    <rect x="30" y="108" width="46" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="22" y="130" width="86" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="30" y="139" width="55" height="8" rx="4" fill="#94a3b8"/>
    <rect x="30" y="150" width="42" height="7" rx="3.5" fill="#e2e8f0"/>
