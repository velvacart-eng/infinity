<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Email client setup on desktop and mobile illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="115" cy="115" r="90" fill="#c7d2fe" opacity="0.5"/>
  <circle cx="685" cy="495" r="100" fill="#ddd6fe" opacity="0.5"/>
  <!-- monitor -->
  <g transform="translate(160,150)">
    <rect width="400" height="270" rx="20" fill="#1e293b"/>
    <rect x="14" y="14" width="372" height="242" rx="12" fill="#ffffff"/>
    <!-- inbox UI -->
    <rect x="14" y="14" width="110" height="242" rx="12" fill="#f1f5f9"/>
    <rect x="28" y="34" width="80" height="12" rx="6" fill="#94a3b8"/>
    <rect x="28" y="58" width="64" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="28" y="82" width="72" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="140" y="34" width="220" height="16" rx="8" fill="url(#brand)"/>
    <g>
      <rect x="140" y="66" width="230" height="42" rx="10" fill="#eef2ff"/>
      <rect x="152" y="78" width="120" height="10" rx="5" fill="#64748b"/>
      <rect x="152" y="92" width="170" height="8" rx="4" fill="#cbd5e1"/>
      <rect x="140" y="116" width="230" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="152" y="128" width="110" height="10" rx="5" fill="#94a3b8"/>
      <rect x="152" y="142" width="160" height="8" rx="4" fill="#e2e8f0"/>
      <rect x="140" y="166" width="230" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="152" y="178" width="130" height="10" rx="5" fill="#94a3b8"/>
      <rect x="152" y="192" width="150" height="8" rx="4" fill="#e2e8f0"/>
    </g>
