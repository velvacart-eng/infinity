    <circle r="34" fill="#22c55e"/>
    <path d="M-14 0 a14 14 0 0 1 24 -10 M14 0 a14 14 0 0 1 -24 10" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M8 -18 l6 10 l-12 0 Z" fill="#ffffff" transform="rotate(30)"/>
    <path d="M-8 18 l-6 -10 l12 0 Z" fill="#ffffff" transform="rotate(30)"/>
  </g>
  <!-- settings bar -->
  <g transform="translate(220,480)">
    <rect width="360" height="44" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="180" y="29" font-family="Consolas, monospace" font-size="17" font-weight="bold" fill="#475569" text-anchor="middle">imap.example.com &#183; 993 &#183; SSL</text>
