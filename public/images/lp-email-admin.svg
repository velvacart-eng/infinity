<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Email administration console illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="690" cy="120" r="90" fill="#ddd6fe" opacity="0.5"/>
  <circle cx="120" cy="490" r="100" fill="#c7d2fe" opacity="0.5"/>
  <!-- console window -->
  <rect x="140" y="110" width="520" height="390" rx="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="140" y="110" width="520" height="60" rx="26" fill="url(#brand)"/>
  <rect x="140" y="152" width="520" height="18" fill="url(#brand)"/>
  <circle cx="176" cy="140" r="8" fill="#ffffff" opacity="0.85"/>
  <circle cx="202" cy="140" r="8" fill="#ffffff" opacity="0.6"/>
  <circle cx="228" cy="140" r="8" fill="#ffffff" opacity="0.35"/>
  <text x="400" y="147" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">Mail Admin Console</text>
  <!-- user rows -->
  <g>
    <rect x="172" y="196" width="456" height="62" rx="14" fill="#f1f5f9"/>
    <circle cx="208" cy="227" r="18" fill="#2563eb"/>
    <rect x="240" y="216" width="150" height="11" rx="5.5" fill="#94a3b8"/>
    <rect x="240" y="234" width="100" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="548" y="212" width="52" height="30" rx="15" fill="#22c55e"/>
    <circle cx="580" cy="227" r="11" fill="#ffffff"/>

    <rect x="172" y="270" width="456" height="62" rx="14" fill="#f1f5f9"/>
    <circle cx="208" cy="301" r="18" fill="#8b5cf6"/>
    <rect x="240" y="290" width="170" height="11" rx="5.5" fill="#94a3b8"/>
    <rect x="240" y="308" width="120" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="548" y="286" width="52" height="30" rx="15" fill="#22c55e"/>
    <circle cx="580" cy="301" r="11" fill="#ffffff"/>

    <rect x="172" y="344" width="456" height="62" rx="14" fill="#f1f5f9"/>
    <circle cx="208" cy="375" r="18" fill="#0ea5e9"/>
    <rect x="240" y="364" width="140" height="11" rx="5.5" fill="#94a3b8"/>
    <rect x="240" y="382" width="90" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="548" y="360" width="52" height="30" rx="15" fill="#cbd5e1"/>
    <circle cx="568" cy="375" r="11" fill="#ffffff"/>
  </g>
  <!-- bottom actions -->
  <rect x="172" y="428" width="140" height="40" rx="20" fill="url(#brand)"/>
  <text x="242" y="454" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">+ Mailbox</text>
  <rect x="326" y="428" width="140" height="40" rx="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="396" y="454" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#475569" text-anchor="middle">Aliases</text>
  <rect x="480" y="428" width="148" height="40" rx="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="554" y="454" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#475569" text-anchor="middle">Forwarding</text>
  <!-- floating gear -->
  <g transform="translate(650,470)">
    <circle r="46" fill="#1e293b"/>
    <circle r="17" fill="#f5f3ff"/>
    <g fill="#1e293b">
      <rect x="-7" y="-62" width="14" height="20" rx="5"/>
      <rect x="-7" y="42" width="14" height="20" rx="5"/>
      <rect x="-62" y="-7" width="20" height="14" rx="5"/>
      <rect x="42" y="-7" width="20" height="14" rx="5"/>
      <rect x="-7" y="-62" width="14" height="20" rx="5" transform="rotate(45)"/>
      <rect x="-7" y="-62" width="14" height="20" rx="5" transform="rotate(135)"/>
      <rect x="-7" y="42" width="14" height="20" rx="5" transform="rotate(45)"/>
      <rect x="-7" y="42" width="14" height="20" rx="5" transform="rotate(135)"/>
    </g>
  </g>
</svg>
