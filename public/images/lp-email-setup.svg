<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Business email setup illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="brand2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="120" cy="110" r="90" fill="#c7d2fe" opacity="0.5"/>
  <circle cx="700" cy="500" r="110" fill="#ddd6fe" opacity="0.5"/>
  <circle cx="660" cy="100" r="50" fill="#bfdbfe" opacity="0.4"/>
  <!-- main panel -->
  <rect x="170" y="130" width="460" height="340" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="170" y="130" width="460" height="64" rx="28" fill="#f1f5f9"/>
  <rect x="170" y="176" width="460" height="18" fill="#f1f5f9"/>
  <circle cx="208" cy="162" r="8" fill="#f87171"/>
  <circle cx="236" cy="162" r="8" fill="#fbbf24"/>
  <circle cx="264" cy="162" r="8" fill="#34d399"/>
  <!-- envelope -->
  <g transform="translate(310,210)">
    <rect width="180" height="130" rx="16" fill="url(#brand)"/>
    <path d="M12 22 L90 84 L168 22" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 108 L64 62 M168 108 L116 62" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- gear -->
  <g transform="translate(505,335)">
    <circle r="52" fill="#1e293b"/>
    <circle r="20" fill="#f5f3ff"/>
    <g fill="#1e293b">
      <rect x="-8" y="-70" width="16" height="24" rx="6"/>
      <rect x="-8" y="46" width="16" height="24" rx="6"/>
      <rect x="-70" y="-8" width="24" height="16" rx="6"/>
      <rect x="46" y="-8" width="24" height="16" rx="6"/>
      <rect x="-8" y="-70" width="16" height="24" rx="6" transform="rotate(45)"/>
      <rect x="-8" y="-70" width="16" height="24" rx="6" transform="rotate(135)"/>
      <rect x="-8" y="46" width="16" height="24" rx="6" transform="rotate(45)"/>
      <rect x="-8" y="46" width="16" height="24" rx="6" transform="rotate(135)"/>
    </g>
  </g>
  <!-- config rows -->
  <rect x="210" y="390" width="150" height="14" rx="7" fill="#cbd5e1"/>
  <rect x="210" y="418" width="110" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="390" y="390" width="90" height="14" rx="7" fill="#c7d2fe"/>
  <rect x="390" y="418" width="60" height="14" rx="7" fill="#e2e8f0"/>
  <!-- at-symbol chip -->
  <g transform="translate(212,255)">
    <rect width="72" height="72" rx="18" fill="url(#brand2)"/>
    <text x="36" y="50" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">@</text>
  </g>
</svg>
