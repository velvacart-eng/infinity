<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Email security and authentication illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="120" cy="480" r="95" fill="#c7d2fe" opacity="0.5"/>
  <circle cx="680" cy="110" r="95" fill="#ddd6fe" opacity="0.5"/>
  <!-- envelope -->
  <g transform="translate(260,180)">
    <rect width="280" height="200" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M30 30 L140 118 L250 30" fill="none" stroke="#94a3b8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="140" width="130" height="13" rx="6.5" fill="#cbd5e1"/>
    <rect x="40" y="166" width="90" height="13" rx="6.5" fill="#e2e8f0"/>
  </g>
  <!-- shield -->
  <g transform="translate(470,270)">
    <path d="M0 -110 C 40 -88, 80 -78, 105 -76 C 105 0, 88 72, 0 116 C -88 72, -105 0, -105 -76 C -80 -78, -40 -88, 0 -110 Z" fill="url(#brand)"/>
    <path d="M0 -88 C 30 -70, 62 -62, 82 -60 C 82 -4, 68 54, 0 90 C -68 54, -82 -4, -82 -60 C -62 -62, -30 -70, 0 -88 Z" fill="#ffffff" opacity="0.15"/>
    <path d="M-38 -6 l26 26 l50 -56" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- lock chip -->
  <g transform="translate(210,330)">
    <rect width="88" height="72" rx="16" fill="#1e293b"/>
    <rect x="28" y="-26" width="32" height="40" rx="16" fill="none" stroke="#1e293b" stroke-width="12"/>
    <circle cx="44" cy="32" r="8" fill="#ffffff"/>
    <rect x="40" y="34" width="8" height="16" rx="4" fill="#ffffff"/>
  </g>
  <!-- auth dots -->
  <g font-family="Arial, sans-serif" font-weight="bold">
    <rect x="230" y="440" width="100" height="36" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="280" y="464" font-size="16" fill="#2563eb" text-anchor="middle">SPF</text>
    <rect x="350" y="440" width="110" height="36" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="405" y="464" font-size="16" fill="#8b5cf6" text-anchor="middle">DKIM</text>
    <rect x="480" y="440" width="120" height="36" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="540" y="464" font-size="16" fill="#1e293b" text-anchor="middle">DMARC</text>
  </g>
</svg>
