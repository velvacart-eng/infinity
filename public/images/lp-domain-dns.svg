<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Domain and DNS management illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="690" cy="490" r="100" fill="#ddd6fe" opacity="0.5"/>
  <circle cx="110" cy="120" r="85" fill="#c7d2fe" opacity="0.5"/>
  <!-- globe -->
  <g transform="translate(400,290)">
    <circle r="140" fill="url(#brand)"/>
    <ellipse rx="140" ry="52" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.5"/>
    <ellipse rx="62" ry="140" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.5"/>
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#ffffff" stroke-width="7" opacity="0.5"/>
    <circle r="140" fill="none" stroke="#ffffff" stroke-width="10"/>
  </g>
  <!-- domain bar -->
  <g transform="translate(240,110)">
    <rect width="320" height="56" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="30" cy="28" r="10" fill="#22c55e"/>
    <text x="52" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#334155">yourdomain.com</text>
  </g>
  <!-- dns chips -->
  <g font-family="Arial, sans-serif" font-weight="bold" font-size="17">
    <rect x="150" y="440" width="120" height="40" rx="20" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="210" y="466" fill="#7c3aed" text-anchor="middle">MX</text>
    <rect x="290" y="440" width="120" height="40" rx="20" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="350" y="466" fill="#7c3aed" text-anchor="middle">A / AAAA</text>
    <rect x="430" y="440" width="120" height="40" rx="20" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="490" y="466" fill="#7c3aed" text-anchor="middle">CNAME</text>
    <rect x="570" y="440" width="90" height="40" rx="20" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="615" y="466" fill="#7c3aed" text-anchor="middle">TXT</text>
  </g>
  <!-- connectors -->
  <path d="M210 440 L320 370 M350 440 L370 368 M490 440 L440 368 M615 440 L470 380" stroke="#c4b5fd" stroke-width="4" stroke-dasharray="8 7" fill="none"/>
</svg>
