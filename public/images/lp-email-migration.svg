<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Email migration between providers illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="brand2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="110" cy="480" r="95" fill="#c7d2fe" opacity="0.5"/>
  <circle cx="690" cy="120" r="100" fill="#ddd6fe" opacity="0.5"/>
  <!-- source mailbox -->
  <g transform="translate(90,190)">
    <rect width="210" height="230" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="45" y="46" width="120" height="88" rx="12" fill="#94a3b8"/>
    <path d="M55 58 L105 96 L155 58" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="42" y="158" width="126" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="60" y="182" width="90" height="12" rx="6" fill="#e2e8f0"/>
    <text x="105" y="32" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#64748b" text-anchor="middle">OLD</text>
  </g>
  <!-- destination mailbox -->
  <g transform="translate(500,190)">
    <rect width="210" height="230" rx="24" fill="#ffffff" stroke="#c4b5fd" stroke-width="3"/>
    <rect x="45" y="46" width="120" height="88" rx="12" fill="url(#brand)"/>
    <path d="M55 58 L105 96 L155 58" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="42" y="158" width="126" height="12" rx="6" fill="#c4b5fd"/>
    <rect x="60" y="182" width="90" height="12" rx="6" fill="#ddd6fe"/>
    <circle cx="172" cy="30" r="20" fill="#22c55e"/>
    <path d="M163 30 l7 7 l12 -13" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="105" y="32" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#7c3aed" text-anchor="middle">NEW</text>
  </g>
  <!-- migration arrow -->
  <g transform="translate(0,0)">
    <path d="M320 300 L470 300" stroke="url(#brand)" stroke-width="14" stroke-linecap="round"/>
    <path d="M445 268 L486 300 L445 332" fill="none" stroke="url(#brand)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- flying envelopes -->
    <g transform="translate(348,222)">
      <rect width="56" height="40" rx="8" fill="#8b5cf6"/>
      <path d="M8 12 L28 30 L48 12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(398,320)">
      <rect width="44" height="32" rx="6" fill="#2563eb"/>
      <path d="M6 10 L22 24 L38 10" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- data dots -->
  <circle cx="330" cy="380" r="6" fill="#8b5cf6"/>
  <circle cx="355" cy="392" r="6" fill="#2563eb" opacity="0.7"/>
  <circle cx="380" cy="402" r="6" fill="#2563eb" opacity="0.4"/>
</svg>
