<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="comcast.net mailbox moving to Yahoo Mail illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="100" cy="110" r="85" fill="#c7d2fe" opacity="0.5"/>
  <circle cx="705" cy="490" r="105" fill="#ddd6fe" opacity="0.5"/>
  <!-- comcast.net mailbox -->
  <g transform="translate(80,170)">
    <rect width="230" height="260" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="55" y="60" width="120" height="88" rx="12" fill="#0f172a"/>
    <path d="M65 72 L115 110 L165 72" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="115" y="42" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#334155" text-anchor="middle">@comcast.net</text>
    <rect x="42" y="176" width="146" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="62" y="200" width="106" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="80" y="224" width="70" height="12" rx="6" fill="#e2e8f0"/>
  </g>
  <!-- Yahoo Mail mailbox -->
  <g transform="translate(490,170)">
    <rect width="230" height="260" rx="24" fill="#ffffff" stroke="#8b5cf6" stroke-width="3"/>
    <rect x="55" y="60" width="120" height="88" rx="12" fill="#7c3aed"/>
    <path d="M65 72 L115 110 L165 72" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="115" y="42" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#7c3aed" text-anchor="middle">Yahoo Mail</text>
    <rect x="42" y="176" width="146" height="12" rx="6" fill="#ddd6fe"/>
    <rect x="62" y="200" width="106" height="12" rx="6" fill="#ede9fe"/>
    <rect x="80" y="224" width="70" height="12" rx="6" fill="#ede9fe"/>
    <circle cx="196" cy="32" r="22" fill="#22c55e"/>
    <path d="M186 32 l8 8 l14 -15" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- arrow -->
  <path d="M330 300 L460 300" stroke="url(#brand)" stroke-width="14" stroke-linecap="round"/>
  <path d="M438 270 L476 300 L438 330" fill="none" stroke="url(#brand)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- moving envelope -->
  <g transform="translate(356,216)">
    <rect width="64" height="46" rx="9" fill="#2563eb"/>
    <path d="M9 14 L32 34 L55 14" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- labels -->
  <rect x="330" y="350" width="140" height="34" rx="17" fill="#1e293b"/>
  <text x="400" y="373" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2025 &#8211; 2026</text>
  <text x="400" y="416" font-family="Arial, sans-serif" font-size="15" fill="#64748b" text-anchor="middle">Same address, moved safely</text>
</svg>
