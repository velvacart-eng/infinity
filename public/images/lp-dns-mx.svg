<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Email DNS and MX record configuration illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="115" cy="115" r="90" fill="#c7d2fe" opacity="0.5"/>
  <circle cx="690" cy="485" r="105" fill="#ddd6fe" opacity="0.5"/>
  <!-- records panel -->
  <rect x="150" y="110" width="500" height="380" rx="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="150" y="110" width="500" height="60" rx="26" fill="#f1f5f9"/>
  <rect x="150" y="152" width="500" height="18" fill="#f1f5f9"/>
  <circle cx="186" cy="140" r="8" fill="#f87171"/>
  <circle cx="214" cy="140" r="8" fill="#fbbf24"/>
  <circle cx="242" cy="140" r="8" fill="#34d399"/>
  <text x="400" y="147" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#334155" text-anchor="middle">DNS Records &#8212; yourdomain.com</text>
  <!-- record rows -->
  <g font-family="Consolas, monospace" font-size="20" font-weight="bold">
    <rect x="182" y="196" width="436" height="56" rx="14" fill="#eef2ff"/>
    <rect x="198" y="212" width="56" height="26" rx="8" fill="#2563eb"/>
    <text x="226" y="231" fill="#ffffff" text-anchor="middle">MX</text>
    <text x="272" y="231" fill="#475569">10 mail.yourdomain.com</text>

    <rect x="182" y="264" width="436" height="56" rx="14" fill="#f5f3ff"/>
    <rect x="198" y="280" width="56" height="26" rx="8" fill="#8b5cf6"/>
    <text x="226" y="299" fill="#ffffff" text-anchor="middle">SPF</text>
    <text x="272" y="299" fill="#475569">v=spf1 include:_spf&#8230;</text>

    <rect x="182" y="332" width="436" height="56" rx="14" fill="#eef2ff"/>
    <rect x="198" y="348" width="70" height="26" rx="8" fill="#0ea5e9"/>
    <text x="233" y="367" fill="#ffffff" text-anchor="middle">DKIM</text>
    <text x="286" y="367" fill="#475569">selector._domainkey</text>

    <rect x="182" y="400" width="436" height="56" rx="14" fill="#f5f3ff"/>
    <rect x="198" y="416" width="78" height="26" rx="8" fill="#1e293b"/>
    <text x="237" y="435" fill="#ffffff" text-anchor="middle">DMARC</text>
    <text x="294" y="435" fill="#475569">v=DMARC1; p=quarantine</text>
  </g>
  <!-- check badge -->
  <circle cx="642" cy="228" r="30" fill="#22c55e"/>
  <path d="M628 228 l10 10 l20 -22" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- envelope routing -->
  <g transform="translate(96,300)">
    <rect width="72" height="52" rx="10" fill="url(#brand)"/>
    <path d="M10 16 L36 38 L62 16" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M168 326 C 168 400, 132 420, 96 428" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
</svg>
